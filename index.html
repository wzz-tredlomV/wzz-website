<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git仓库直接保存器 · 根目录版</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #0a1929 0%, #0f1e2f 100%);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            max-width: 700px;
            width: 100%;
            background: rgba(18, 30, 41, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(64, 128, 128, 0.3);
            border-radius: 28px;
            padding: 32px;
            color: #e3f0f0;
            box-shadow: 0 25px 40px -12px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 1.8rem;
            margin-top: 0;
            margin-bottom: 8px;
            color: #a5f0e6;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        h1 span {
            background: #1e4a4a;
            color: #caf0fe;
            font-size: 0.9rem;
            padding: 4px 16px;
            border-radius: 30px;
            font-weight: 400;
        }
        .desc {
            color: #b0d4d4;
            margin-bottom: 28px;
            border-left: 4px solid #2fafaf;
            padding-left: 18px;
            font-size: 0.98rem;
        }
        
        /* 配置面板 - 简化 */
        .config-panel {
            background: #0e1e26;
            border-radius: 20px;
            padding: 22px;
            margin-bottom: 24px;
            border: 1px solid #2a4a4f;
        }
        .config-title {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #a5e0d0;
            font-weight: 500;
            margin-bottom: 18px;
        }
        .input-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            color: #8fb5b5;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            background: #0c1a20;
            border: 1px solid #2f5a5a;
            border-radius: 14px;
            color: #eaf4f4;
            font-size: 0.95rem;
        }
        input:focus {
            outline: none;
            border-color: #4fc9c9;
        }
        
        .token-note {
            background: #162b33;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.8rem;
            color: #afdada;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }
        
        /* 上传区 */
        .upload-area {
            background: #0e1c22;
            border-radius: 20px;
            padding: 28px;
            border: 2px dashed #2f6f6f;
            text-align: center;
            cursor: pointer;
            margin-bottom: 24px;
        }
        .upload-area:hover {
            border-color: #4fcfcf;
            background: #11282e;
        }
        .upload-icon {
            font-size: 44px;
            margin-bottom: 10px;
        }
        
        /* 文件列表 - 简化，只显示已上传文件 */
        .file-list {
            background: #0e1c22;
            border-radius: 20px;
            padding: 16px;
            margin-top: 16px;
            max-height: 300px;
            overflow-y: auto;
        }
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #132a30;
            border-radius: 16px;
            margin-bottom: 8px;
            border: 1px solid #1f464c;
        }
        .file-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .file-name {
            font-weight: 500;
            color: #d6f0f0;
        }
        .file-meta {
            font-size: 0.75rem;
            color: #8fb0b0;
        }
        .success-badge {
            background: #1e5a4a;
            color: #c0f0d0;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
        }
        
        .action-buttons {
            display: flex;
            gap: 16px;
            justify-content: flex-end;
            margin-top: 24px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 28px;
            border-radius: 40px;
            border: 1px solid #2f6f6f;
            background: transparent;
            color: #d2f0f0;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }
        .btn-primary {
            background: #1e6a6a;
            border-color: #3fafaf;
            color: white;
        }
        .btn-primary:hover {
            background: #2f8f8f;
        }
        
        .status {
            margin-top: 20px;
            padding: 14px;
            border-radius: 16px;
            background: #0e1a1e;
            border-left: 6px solid #3fafaf;
            color: #c0e6e6;
            font-size: 0.9rem;
        }
        
        .footnote {
            margin-top: 24px;
            font-size: 0.8rem;
            color: #7faaaa;
            text-align: center;
            border-top: 1px solid #1f4a4a;
            padding-top: 20px;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>
        📁 根目录直存器
        <span>保存到仓库根目录</span>
    </h1>
    <div class="desc">
        ⚡ 上传文件直接保存到GitHub仓库的 <strong style="color: #8ff0f0;">根目录</strong> · 点击下载完整仓库ZIP
    </div>
    
    <!-- GitHub配置面板 - 只保留必要项 -->
    <div class="config-panel">
        <div class="config-title">🔧 GitHub 配置</div>
        <div class="input-group">
            <label>仓库地址 (owner/repo)</label>
            <input type="text" id="repoPath" placeholder="例如: wzz-tredlomV/wzz-website" value="wzz-tredlomV/wzz-website">
        </div>
        <div class="input-group">
            <label>GitHub Token (需要repo权限)</label>
            <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
            <div class="token-note">
                🔐 Token只存在你浏览器，用于调用GitHub API
            </div>
        </div>
        <div class="input-group">
            <label>分支名称</label>
            <input type="text" id="branchName" placeholder="main" value="main">
        </div>
    </div>
    
    <!-- 隐藏文件输入 -->
    <input type="file" id="fileInput" multiple style="display: none">
    
    <!-- 上传区域 - 直接保存到根目录 -->
    <div class="upload-area" id="uploadTrigger">
        <div class="upload-icon">📤⬆️</div>
        <div style="font-size: 1.2rem; margin-bottom: 6px; color: #c0f0f0;">点击或拖拽文件到此处</div>
        <div style="color: #7fa0a0;">文件将直接保存到仓库 <strong>根目录</strong></div>
    </div>
    
    <!-- 已上传文件列表（实时显示） -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 16px;">
        <h3 style="color: #b0e0e0; margin: 0;">📋 本次上传记录</h3>
        <button class="btn" id="clearHistoryBtn">🗑️ 清空记录</button>
    </div>
    <div id="uploadHistoryContainer" class="file-list">
        <div style="text-align: center; padding: 30px; color: #7fa0a0;">
            ⏳ 暂无上传记录，上传后文件会显示在这里
        </div>
    </div>
    
    <!-- 操作按钮 - 只保留下载ZIP和保存配置 -->
    <div class="action-buttons">
        <button class="btn btn-primary" id="downloadRepoBtn">📦 下载完整仓库ZIP</button>
        <button class="btn" id="saveConfigBtn">💾 保存配置</button>
    </div>
    
    <!-- 状态栏 -->
    <div id="statusMessage" class="status">
        ⚡ 就绪 · 文件将保存到仓库根目录
    </div>
    
    <div class="footnote">
        📍 上传直接调用GitHub API · 下载直接跳转 <span style="color: #8ff0f0;">/archive/refs/heads/main.zip</span>
    </div>
</div>

<script>
// ==================== 极简版：直接保存到根目录 ====================
class RootDirSaver {
    constructor() {
        this.uploadHistory = []; // 本次上传记录
        this.loadConfig();
        this.loadHistory();
    }
    
    // 从localStorage加载配置
    loadConfig() {
        try {
            const saved = localStorage.getItem('rootDirConfig');
            if (saved) {
                const config = JSON.parse(saved);
                document.getElementById('repoPath').value = config.repo || 'wzz-tredlomV/wzz-website';
                document.getElementById('githubToken').value = config.token || '';
                document.getElementById('branchName').value = config.branch || 'main';
                return config;
            }
        } catch (e) {}
        return { 
            repo: 'wzz-tredlomV/wzz-website', 
            token: '', 
            branch: 'main'
        };
    }
    
    // 保存配置
    saveConfig() {
        const config = {
            repo: document.getElementById('repoPath').value.trim(),
            token: document.getElementById('githubToken').value.trim(),
            branch: document.getElementById('branchName').value.trim() || 'main'
        };
        localStorage.setItem('rootDirConfig', JSON.stringify(config));
        return config;
    }
    
    // 获取当前配置
    getConfig() {
        return {
            repo: document.getElementById('repoPath').value.trim(),
            token: document.getElementById('githubToken').value.trim(),
            branch: document.getElementById('branchName').value.trim() || 'main'
        };
    }
    
    // 加载上传历史
    loadHistory() {
        try {
            const history = localStorage.getItem('uploadHistory');
            if (history) {
                this.uploadHistory = JSON.parse(history);
                this.renderHistory();
            }
        } catch (e) {}
    }
    
    // 添加上传记录
    addHistory(file) {
        this.uploadHistory.unshift({
            name: file.name,
            size: file.size,
            time: new Date().toLocaleString(),
            path: file.name // 直接根目录
        });
        // 只保留最近20条
        if (this.uploadHistory.length > 20) {
            this.uploadHistory = this.uploadHistory.slice(0, 20);
        }
        localStorage.setItem('uploadHistory', JSON.stringify(this.uploadHistory));
        this.renderHistory();
    }
    
    // 清空历史
    clearHistory() {
        this.uploadHistory = [];
        localStorage.removeItem('uploadHistory');
        this.renderHistory();
    }
    
    // 渲染上传历史
    renderHistory() {
        const container = document.getElementById('uploadHistoryContainer');
        if (this.uploadHistory.length === 0) {
            container.innerHTML = '<div style="text-align: center; padding: 30px; color: #7fa0a0;">⏳ 暂无上传记录</div>';
            return;
        }
        
        let html = '';
        this.uploadHistory.forEach(file => {
            const size = this.formatFileSize(file.size);
            html += `
                <div class="file-item">
                    <div class="file-info">
                        <span style="font-size: 22px;">📄</span>
                        <div>
                            <div class="file-name">${this.escapeHtml(file.name)}</div>
                            <div class="file-meta">${size} · 根目录</div>
                        </div>
                    </div>
                    <span class="success-badge">✅ 已上传</span>
                </div>
            `;
        });
        container.innerHTML = html;
    }
    
    // 上传文件到GitHub根目录
    async uploadFile(file) {
        const config = this.getConfig();
        if (!config.repo || !config.token) {
            throw new Error('请填写仓库地址和GitHub Token');
        }
        
        // 直接使用文件名，不带任何路径 - 保存到根目录！
        const fileName = file.name;
        
        // 读取文件内容转为Base64
        const content = await this.fileToBase64(file);
        const base64Content = content.split(',')[1];
        
        // 先检查文件是否存在（获取sha）
        let sha = null;
        try {
            const checkUrl = `https://api.github.com/repos/${config.repo}/contents/${encodeURIComponent(fileName)}?ref=${config.branch}`;
            const checkResponse = await fetch(checkUrl, {
                headers: {
                    'Authorization': `Bearer ${config.token}`,
                    'Accept': 'application/vnd.github.v3+json'
                }
            });
            
            if (checkResponse.ok) {
                const existing = await checkResponse.json();
                sha = existing.sha;
            }
        } catch (e) {
            // 文件不存在，忽略错误
        }
        
        // 上传到GitHub
        const uploadUrl = `https://api.github.com/repos/${config.repo}/contents/${encodeURIComponent(fileName)}`;
        const uploadResponse = await fetch(uploadUrl, {
            method: 'PUT',
            headers: {
                'Authorization': `Bearer ${config.token}`,
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                message: `Upload ${fileName} to root via CF Pages`,
                content: base64Content,
                sha: sha,
                branch: config.branch
            })
        });
        
        const result = await uploadResponse.json();
        
        if (!uploadResponse.ok) {
            throw new Error(result.message || '上传失败');
        }
        
        // 添加上传记录
        this.addHistory(file);
        
        return result;
    }
    
    // 获取仓库ZIP下载链接
    getRepoZipUrl() {
        const config = this.getConfig();
        if (!config.repo) {
            throw new Error('请填写仓库地址');
        }
        return `https://github.com/${config.repo}/archive/refs/heads/${config.branch}.zip`;
    }
    
    // 下载完整仓库
    downloadRepoZip() {
        const url = this.getRepoZipUrl();
        window.open(url, '_blank');
        return url;
    }
    
    // 辅助函数
    fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
        });
    }
    
    formatFileSize(bytes) {
        if (bytes === 0) return '0 B';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }
    
    escapeHtml(unsafe) {
        if (!unsafe) return '';
        return String(unsafe)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
}

// ==================== 初始化 ====================
const saver = new RootDirSaver();
const fileInput = document.getElementById('fileInput');
const uploadTrigger = document.getElementById('uploadTrigger');
const statusEl = document.getElementById('statusMessage');

// 更新状态
function setStatus(msg, isError = false) {
    statusEl.innerHTML = msg;
    statusEl.style.borderLeftColor = isError ? '#cf6f6f' : '#3fafaf';
}

// 处理上传
async function handleUpload(files) {
    if (!files || files.length === 0) return;
    
    for (let i = 0; i < files.length; i++) {
        const file = files[i];
        try {
            setStatus(`📤 正在上传: ${file.name} 到仓库根目录...`);
            await saver.uploadFile(file);
            setStatus(`✅ 上传成功: ${file.name} → 仓库根目录`);
        } catch (error) {
            setStatus(`❌ 上传失败: ${file.name} - ${error.message}`, true);
            break;
        }
    }
}

// ==================== 事件绑定 ====================
uploadTrigger.addEventListener('click', () => fileInput.click());

uploadTrigger.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadTrigger.style.background = '#144048';
});

uploadTrigger.addEventListener('dragleave', (e) => {
    e.preventDefault();
    uploadTrigger.style.background = '#0e1c22';
});

uploadTrigger.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadTrigger.style.background = '#0e1c22';
    handleUpload(e.dataTransfer.files);
});

fileInput.addEventListener('change', (e) => {
    handleUpload(e.target.files);
    fileInput.value = '';
});

// 下载完整仓库ZIP
document.getElementById('downloadRepoBtn').addEventListener('click', () => {
    try {
        const url = saver.getRepoZipUrl();
        setStatus(`📦 正在跳转下载: ${url}`);
        saver.downloadRepoZip();
    } catch (error) {
        setStatus('❌ ' + error.message, true);
    }
});

// 保存配置
document.getElementById('saveConfigBtn').addEventListener('click', () => {
    saver.saveConfig();
    setStatus('💾 配置已保存到浏览器');
});

// 清空历史
document.getElementById('clearHistoryBtn').addEventListener('click', () => {
    saver.clearHistory();
    setStatus('🗑️ 上传记录已清空');
});

// 初始化配置显示
document.addEventListener('DOMContentLoaded', () => {
    saver.loadConfig();
});

// 阻止默认拖拽
document.addEventListener('dragover', (e) => e.preventDefault());
document.addEventListener('drop', (e) => e.preventDefault());
</script>
</body>
</html>
