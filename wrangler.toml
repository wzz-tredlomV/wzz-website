name = "wzz-website"
main = "workers/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# 自定义域名配置（Custom Domain 不支持通配符和路径）
routes = [
  { pattern = "wzzyyds2011.de5.net", custom_domain = true }
]

# 可选：环境变量
# [vars]
# CUSTOM_VAR = "value"

# 可选：KV 命名空间（用于缓存）
# [[kv_namespaces]]
# binding = "CACHE"
# id = "your-kv-namespace-id"
